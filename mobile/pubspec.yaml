name: smartpkl_mobile
description: "SmartPKL - Platform PKL Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # HTTP & API
  http: ^1.2.0
  
  # State Management
  provider: ^6.1.0
  
  # Local Storage
  shared_preferences: ^2.3.0
  
  # Date/Time
  intl: ^0.20.0
  
  # Image
  cached_network_image: ^3.4.1
  
  # Pull to refresh
  pull_to_refresh: ^2.0.0
  
  # Time ago
  timeago: ^3.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
